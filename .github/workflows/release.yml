# Builds the plugin and publishes a GitHub release (used by BRAT) on every
# push to main whose manifest version has no release yet. To release, bump
# "version" in manifest.json and package.json and merge. The tag is the
# manifest version (no "v").
name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check for new version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p "require('./manifest.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if gh release view "$version" > /dev/null 2>&1; then
            echo "Release $version already exists, skipping."
            echo "new=false" >> "$GITHUB_OUTPUT"
          else
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        if: steps.version.outputs.new == 'true'
        with:
          node-version: 22
          cache: npm

      - if: steps.version.outputs.new == 'true'
        run: npm ci && npm run build

      - name: Create release
        if: steps.version.outputs.new == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.version.outputs.version }}" --target "$GITHUB_SHA" \
            --title "${{ steps.version.outputs.version }}" --generate-notes \
            main.js manifest.json styles.css
