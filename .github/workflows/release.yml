# Builds the plugin and publishes a GitHub release (used by BRAT).
# Bump "version" in manifest.json and package.json, then run this workflow
# from the Actions tab. The release tag is the manifest version (no "v").
name: Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p "require('./manifest.json').version")
          gh release create "$version" --target "$GITHUB_SHA" --title "$version" --generate-notes \
            main.js manifest.json styles.css
